name: Frontend Validation

on:
  pull_request:
    branches: [main, dev]

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Run production build
        run: npm run build

      - name: Run Cloudflare build
        run: npm run build:cloudflare
