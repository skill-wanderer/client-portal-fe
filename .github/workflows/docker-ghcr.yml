name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      # Required GitHub repository variables for production builds:
      # NEXT_PUBLIC_OIDC_CLIENT_ID=client-portal-fe
      # NEXT_PUBLIC_OIDC_ISSUER=https://sso.skill-wanderer.com/realms/client-portal
      # NEXT_PUBLIC_OIDC_REDIRECT_URI=https://client.skill-wanderer.com/auth/callback
      # NEXT_PUBLIC_OIDC_SILENT_REDIRECT_URI=https://client.skill-wanderer.com/auth/silent-callback
      # NEXT_PUBLIC_OIDC_LOGOUT_REDIRECT_URI=https://client.skill-wanderer.com/login
      # OIDC_ISSUER=https://sso.skill-wanderer.com/realms/client-portal
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_OIDC_CLIENT_ID=${{ vars.NEXT_PUBLIC_OIDC_CLIENT_ID }}
            NEXT_PUBLIC_OIDC_ISSUER=${{ vars.NEXT_PUBLIC_OIDC_ISSUER }}
            NEXT_PUBLIC_OIDC_REDIRECT_URI=${{ vars.NEXT_PUBLIC_OIDC_REDIRECT_URI }}
            NEXT_PUBLIC_OIDC_SILENT_REDIRECT_URI=${{ vars.NEXT_PUBLIC_OIDC_SILENT_REDIRECT_URI }}
            NEXT_PUBLIC_OIDC_LOGOUT_REDIRECT_URI=${{ vars.NEXT_PUBLIC_OIDC_LOGOUT_REDIRECT_URI }}
            OIDC_ISSUER=${{ vars.OIDC_ISSUER }}
            NODE_ENV=production
